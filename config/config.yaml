
app:
  name: "4-Lane Traffic Controller"
  version: "2.0.0"
  debug: false
  log_level: "INFO"

models:
  yolo:
    model_name: "models/yolov8n.pt"
    confidence_threshold: 0.25
    device: "auto" 
    input_size: [640, 640]

  lstm:
    model_path: "models/lstm_best.h5"
    sequence_length: 10
    features: ["traffic_density", "avg_speed", "time_of_day"]
    prediction_horizon: 5
    num_intersections: 4

  reinforcement_learning:
    model_path: "models/dqn_final.pt"
    agent_type: "DoubleDQN"
    trained_variant: "double_dqn"
    use_trained_weights: true

dashboard:
  title: "4-Lane Traffic Controller"
  port: 8501
  theme: "dark"
  auto_refresh_interval: 5

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "logs/tms.log"
  max_file_size: "10MB"
  backup_count: 5
